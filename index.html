<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Keep them going · WSE Staff Training</title><style>body{margin:0;background:#F6F9FC}
/* ===== Keep Them Going — WSE Staff Portal course ===== */
.kc{--navy:#00335A;--navy2:#0B2242;--ink:#14263A;--mute:#5B6B7C;--line:#DCE5EE;--sky:#EEF4FA;--sky2:#DCEAF6;--blue:#1F6FB2;--teal:#0E8A84;--green:#1E8E5A;--violet:#5B4BC4;--slate:#6B7A8A;
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#F6F9FC;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.kc *{box-sizing:border-box}
.kc button{font-family:inherit}
.kc-top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 10px rgba(0,30,60,.18)}
.kc-top .t{font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap}
.kc-top .t small{display:block;font-weight:500;font-size:11px;opacity:.7}
.kc-steps{flex:1;display:flex;gap:4px;min-width:0}
.kc-steps i{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.kc-steps i b{position:absolute;inset:0;width:0;background:#7FC4FF;border-radius:6px;transition:width .5s}
.kc-xp{background:rgba(255,255,255,.12);border-radius:20px;padding:4px 12px;font-weight:700;font-size:13px;white-space:nowrap;transition:transform .3s}
.kc-xp.pop{transform:scale(1.25)}
.kc-wrap{max-width:980px;margin:0 auto;padding:22px 18px 110px}
.kc-ch{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.kc h1{font-size:30px;line-height:1.2;margin:0 0 10px;color:var(--navy2)}
.kc h2{font-size:24px;line-height:1.25;margin:0 0 10px;color:var(--navy2)}
.kc h3{font-size:17px;margin:0 0 6px;color:var(--navy2)}
.kc p{margin:0 0 12px}
.kc .lead{font-size:17px;color:#33475B}
.kc .mute{color:var(--mute)}
.kc-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 3px rgba(10,40,70,.05)}
.kc-grid{display:grid;gap:14px}
.kc-g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kc-g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:760px){.kc-g2,.kc-g3{grid-template-columns:1fr}.kc h1{font-size:25px}.kc h2{font-size:21px}}
.kc-scr{animation:kcIn .45s ease both}
@keyframes kcIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kc-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 18px}
.kc-nav .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
.kc-nav .hint{flex:1;font-size:13px;color:var(--mute)}
.kc-btn{border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:15px;cursor:pointer;background:var(--navy);color:#fff;transition:transform .15s,opacity .2s,background .2s}
.kc-btn:hover{transform:translateY(-1px)}
.kc-btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.kc-btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.kc-btn.sm{padding:8px 14px;font-size:13px;border-radius:10px}
.kc-pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;background:var(--sky);color:var(--navy)}
/* choices */
.kc-opts{display:grid;gap:10px;margin-top:10px}
.kc-opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-size:15px;cursor:pointer;color:var(--ink);transition:border-color .2s,background .2s,transform .15s;display:flex;gap:10px;align-items:flex-start}
.kc-opt:hover{border-color:#9DBEDD;transform:translateY(-1px)}
.kc-opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sky);color:var(--navy);font-weight:800;font-size:13px;display:grid;place-items:center}
.kc-opt.sel{border-color:var(--navy);background:var(--sky)}
.kc-opt.ok{border-color:var(--green);background:#EAF6EF}
.kc-opt.ok .k{background:var(--green);color:#fff}
.kc-opt.no{border-color:#C9D2DC;background:#F3F5F8;color:#56657A}
.kc-opt.no .k{background:var(--slate);color:#fff}
.kc-opt[disabled]{cursor:default;transform:none}
.kc-fb{margin-top:12px;border-radius:12px;padding:13px 15px;font-size:14.5px;animation:kcIn .35s both}
.kc-fb.ok{background:#EAF6EF;border-left:4px solid var(--green)}
.kc-fb.no{background:#F1F4F8;border-left:4px solid var(--slate)}
.kc-fb.in{background:var(--sky);border-left:4px solid var(--blue)}
/* hero */
.kc-hero{background:linear-gradient(135deg,#00335A 0%,#0B2242 70%);color:#fff;border-radius:22px;padding:34px 30px;position:relative;overflow:hidden}
.kc-hero h1{color:#fff;font-size:38px}
.kc-hero .lead{color:#D7E6F4}
.kc-hero .orb{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(127,196,255,.35),rgba(127,196,255,0) 70%);animation:kcFloat 9s ease-in-out infinite}
@keyframes kcFloat{50%{transform:translate(-18px,14px) scale(1.08)}}
.kc-meta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px}
.kc-meta span{background:rgba(255,255,255,.12);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:600}
.kc-roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media(max-width:640px){.kc-roles{grid-template-columns:1fr}}
.kc-role{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;transition:all .2s}
.kc-role:hover{border-color:#9DBEDD}
.kc-role.sel{border-color:var(--navy);box-shadow:0 0 0 4px rgba(0,51,90,.1)}
.kc-role .ic{font-size:26px}
.kc-role b{display:block;font-size:16px;margin:6px 0 2px;color:var(--navy2)}
.kc-role small{color:var(--mute);font-size:12.5px}
/* scale */
.kc-scale{display:flex;gap:8px;flex-wrap:wrap}
.kc-scale button{flex:1;min-width:52px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;cursor:pointer;font-size:13px;color:var(--mute)}
.kc-scale button b{display:block;font-size:20px;color:var(--navy)}
.kc-scale button.sel{border-color:var(--navy);background:var(--sky)}
/* timeline */
.kc-tl{display:flex;gap:6px;margin:14px 0 16px;overflow-x:auto;padding-bottom:4px}
.kc-tl button{flex:1;min-width:92px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 8px;cursor:pointer;text-align:left;transition:all .2s}
.kc-tl button small{display:block;font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.kc-tl button b{font-size:14px;color:var(--navy2)}
.kc-tl button.on{border-color:var(--navy);background:var(--navy)}
.kc-tl button.on small,.kc-tl button.on b{color:#fff}
.kc-tl button.seen:not(.on){border-color:#9DBEDD}
.kc-bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.kc-bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.kc-bars i{width:100%;max-width:54px;border-radius:8px 8px 0 0;background:var(--navy);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.kc-bars i.low{background:#9DBEDD}
.kc-bars i.zero{background:#fff;border:1.5px dashed #9DBEDD;border-bottom:0;height:8px!important}
.kc-bars em{font-style:normal;font-weight:800;color:var(--navy2);font-size:14px}
.kc-bars-l{display:flex;gap:10px;padding:6px 4px 0}
.kc-bars-l span{flex:1;text-align:center;font-size:12px;color:var(--mute);font-weight:600}
/* spotlight viewer */
.kc-spot{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 10px 30px rgba(0,40,80,.12)}
.kc-spot img{display:block;width:100%;height:auto}
.kc-spot .hole{position:absolute;border-radius:10px;box-shadow:0 0 0 2000px rgba(8,25,45,.55);transition:all .7s cubic-bezier(.3,.8,.25,1);pointer-events:none;outline:3px solid #7FC4FF;outline-offset:2px}
.kc-spot .hole.off{box-shadow:0 0 0 2000px rgba(8,25,45,0);outline-color:transparent}
.kc-spot .lab{position:absolute;background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:6px 11px;border-radius:9px;white-space:nowrap;transition:all .7s cubic-bezier(.3,.8,.25,1);box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:none}
.kc-spot .ptr{position:absolute;width:30px;height:30px;transition:all .9s cubic-bezier(.3,.8,.25,1);pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));z-index:3}
.kc-spot .ptr.tap::after{content:"";position:absolute;left:-10px;top:-10px;width:22px;height:22px;border-radius:50%;border:3px solid #7FC4FF;animation:kcTap .7s ease-out}
@keyframes kcTap{from{transform:scale(.3);opacity:1}to{transform:scale(1.8);opacity:0}}
.kc-spotnav{display:flex;align-items:center;gap:10px;margin-top:12px}
.kc-spotnav .dots{flex:1;display:flex;gap:6px}
.kc-spotnav .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.kc-spotnav .dots i.on{background:var(--navy);width:22px;border-radius:5px}
.kc-say{min-height:64px;margin-top:10px;font-size:15px}
.kc-say b{color:var(--navy2)}
/* flip cards */
.kc-flip{perspective:1000px;cursor:pointer;min-height:190px}
.kc-flip .in{position:relative;width:100%;height:100%;min-height:190px;transition:transform .6s;transform-style:preserve-3d}
.kc-flip.on .in{transform:rotateY(180deg)}
.kc-flip .f,.kc-flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:18px;display:flex;flex-direction:column}
.kc-flip .f{background:#fff;border:1.5px solid var(--line)}
.kc-flip .f .ic{font-size:34px;margin-bottom:auto}
.kc-flip .f b{font-size:17px;color:var(--navy2)}
.kc-flip .f small{color:var(--blue);font-weight:700;font-size:12px;margin-top:4px}
.kc-flip .b{background:var(--navy);color:#fff;transform:rotateY(180deg);font-size:13.5px;overflow:auto}
.kc-flip .b q{display:block;font-style:italic;color:#CFE3F5;margin-bottom:8px}
.kc-flip .b q::before,.kc-flip .b q::after{content:""}
.kc-flip .b span{font-weight:700;color:#7FC4FF;font-size:11px;letter-spacing:1px;text-transform:uppercase}
/* loop */
.kc-loop{position:relative;width:min(420px,100%);aspect-ratio:1;margin:6px auto}
.kc-loop .n{position:absolute;width:44%;transform:translate(-50%,-50%);background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px;font-weight:600;transition:all .5s}
.kc-loop .n b{display:block;font-size:20px}
.kc-loop .n.on{border-color:var(--navy);background:var(--navy);color:#fff;transform:translate(-50%,-50%) scale(1.07)}
.kc-loop svg{position:absolute;inset:0}
.kc-loop .mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:12px;color:var(--mute);width:34%}
.kc-loop .mid b{display:block;font-size:24px;color:var(--navy)}
/* match */
.kc-match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kc-match .col{display:grid;gap:8px;align-content:start}
.kc-mi{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;font-size:14px;cursor:pointer;text-align:left;transition:all .2s;color:var(--ink)}
.kc-mi.sel{border-color:var(--navy);background:var(--sky)}
.kc-mi.done{border-color:var(--green);background:#EAF6EF;cursor:default}
.kc-mi.shake{animation:kcShake .4s}
@keyframes kcShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.kc-mi .tag{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--green);border-radius:6px;padding:1px 6px;margin-right:6px}
/* case file */
.kc-case{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:760px){.kc-case{grid-template-columns:1fr}}
.kc-prof{background:var(--navy);color:#fff;border-radius:16px;padding:18px}
.kc-prof .av{width:56px;height:56px;border-radius:50%;background:#7FC4FF;color:var(--navy2);display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:10px}
.kc-prof b{font-size:18px}
.kc-prof .row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid rgba(255,255,255,.12)}
.kc-prof .row span{opacity:.7}
.kc-ev{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.kc-ev{grid-template-columns:repeat(2,1fr)}}
.kc-evb{border:1.5px dashed #9DBEDD;background:#fff;border-radius:12px;padding:12px;cursor:pointer;text-align:left;transition:all .2s;color:var(--ink)}
.kc-evb .ic{font-size:22px}
.kc-evb b{display:block;font-size:13.5px;margin-top:4px;color:var(--navy2)}
.kc-evb small{color:var(--mute);font-size:11.5px}
.kc-evb.open{border-style:solid;border-color:var(--navy);background:var(--sky)}
.kc-evd{margin-top:12px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:14px;animation:kcIn .35s both}
.kc-evd img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.kc-mock{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.kc-mock .hd{background:var(--navy);color:#fff;padding:8px 12px;font-weight:700;font-size:12.5px}
.kc-mock table{width:100%;border-collapse:collapse}
.kc-mock td,.kc-mock th{padding:7px 10px;border-top:1px solid var(--line);text-align:left}
.kc-mock th{background:var(--sky);font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.kc-flag{display:inline-block;background:#EDE9FB;color:var(--violet);font-weight:700;border-radius:6px;padding:1px 7px;font-size:12px}
.kc-good{display:inline-block;background:#EAF6EF;color:var(--green);font-weight:700;border-radius:6px;padding:1px 7px;font-size:12px}
.kc-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px;text-align:center}
.kc-cal span{padding:6px 0;border-radius:7px;position:relative}
.kc-cal .h{font-weight:700;color:var(--mute);font-size:11px}
.kc-cal .x{background:#EDE9FB}
.kc-cal .s{background:#EAF6EF}
.kc-cal .sb{background:var(--sky)}
/* phone chat */
.kc-phone{width:min(380px,100%);margin:0 auto;border-radius:30px;background:#0B2242;padding:10px;box-shadow:0 20px 40px rgba(0,30,60,.25)}
.kc-phone .scr{background:#ECE5DD;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;height:470px}
.kc-phone .bar{background:#0B5C53;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
.kc-phone .bar .av{width:32px;height:32px;border-radius:50%;background:#7FC4FF;color:#0B2242;font-weight:800;display:grid;place-items:center}
.kc-phone .bar small{display:block;font-size:11px;opacity:.8}
.kc-phone .msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.kc-msg{max-width:82%;padding:8px 11px;border-radius:10px;font-size:14px;line-height:1.4;animation:kcIn .3s both;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.kc-msg.them{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.kc-msg.me{background:#D9FDD3;align-self:flex-end;border-top-right-radius:2px}
.kc-msg.sys{align-self:center;background:#FFFFFFCC;font-size:12px;color:#556;padding:4px 10px}
.kc-typing{align-self:flex-start;background:#fff;border-radius:10px;padding:10px 12px;display:flex;gap:4px}
.kc-typing i{width:7px;height:7px;border-radius:50%;background:#9AA7B4;animation:kcDot 1s infinite}
.kc-typing i:nth-child(2){animation-delay:.15s}.kc-typing i:nth-child(3){animation-delay:.3s}
@keyframes kcDot{50%{transform:translateY(-4px);opacity:.5}}
.kc-meters{display:grid;gap:10px}
.kc-meter{font-size:13px;font-weight:600}
.kc-meter .tr{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.kc-meter .tr i{display:block;height:100%;width:0;background:var(--teal);border-radius:6px;transition:width .8s}
/* A/B messages */
.kc-ab{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.kc-ab{grid-template-columns:1fr}}
.kc-abm{background:#ECE5DD;border-radius:14px;padding:14px;cursor:pointer;border:2px solid transparent;transition:all .2s;text-align:left;color:var(--ink)}
.kc-abm .bub{background:#D9FDD3;border-radius:10px;padding:10px 12px;font-size:14px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.kc-abm .who{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:6px}
.kc-abm.ok{border-color:var(--green)}
.kc-abm.no{opacity:.55}
/* role touch tabs */
.kc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kc-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--navy)}
.kc-tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.kc-touch{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:640px){.kc-touch{grid-template-columns:1fr}}
.kc-tc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;gap:12px}
.kc-tc .when{flex:none;width:54px;height:54px;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:24px}
.kc-tc b{display:block;color:var(--navy2);font-size:14.5px}
.kc-tc q{display:block;font-style:italic;color:#33475B;font-size:13.5px;margin-top:4px}
.kc-tc q::before{content:"“"}.kc-tc q::after{content:"”"}
/* plan builder */
.kc-f{display:grid;gap:6px;margin-bottom:14px}
.kc-f label{font-weight:700;font-size:13.5px;color:var(--navy2)}
.kc-f label small{font-weight:500;color:var(--mute)}
.kc-f input,.kc-f textarea,.kc-f select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:inherit;color:var(--ink);background:#fff}
.kc-f textarea{min-height:92px;resize:vertical}
.kc-f input:focus,.kc-f textarea:focus,.kc-f select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,51,90,.1)}
.kc-chips{display:flex;flex-wrap:wrap;gap:7px}
.kc-chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink);transition:all .15s}
.kc-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.kc-planout{background:linear-gradient(135deg,#00335A,#0B2242);color:#fff;border-radius:18px;padding:22px}
.kc-planout h3{color:#fff}
.kc-planout .r{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.14);font-size:14px}
.kc-planout .r span{color:#9FC3E3;font-weight:600}
.kc-plansteps{display:flex;gap:6px;margin-bottom:14px}
.kc-plansteps i{flex:1;height:5px;border-radius:4px;background:var(--line)}
.kc-plansteps i.on{background:var(--navy)}
/* quiz */
.kc-timer{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.kc-timer i{display:block;height:100%;background:var(--blue);width:100%}
/* certificate */
.kc-cert{background:#fff;border-radius:18px;padding:34px;text-align:center;border:10px solid var(--navy);outline:2px solid var(--sky2);outline-offset:-22px;position:relative}
.kc-cert .s{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--blue);font-weight:700}
.kc-cert .n{font-size:32px;font-weight:800;color:var(--navy2);margin:12px 0 6px}
.kc-cert .c{font-size:18px;font-weight:700;color:var(--navy)}
.kc-stars{display:flex;gap:6px;justify-content:center;margin:10px 0}
.kc-stars button{background:none;border:0;font-size:40px;cursor:pointer;color:#C9D6E3;transition:transform .15s,color .15s;line-height:1}
.kc-stars button.on{color:var(--navy)}
.kc-stars button:hover{transform:scale(1.15)}
.kc-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.kc-badge{display:flex;align-items:center;gap:6px;background:var(--sky);color:var(--navy);border-radius:20px;padding:6px 12px;font-weight:700;font-size:13px;animation:kcIn .4s both}
.kc-toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--navy2);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;font-size:14px;opacity:0;transition:all .4s;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none}
.kc-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.kc-conf{position:fixed;inset:0;pointer-events:none;z-index:70}
.kc-note{font-size:12.5px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px;margin-top:10px}
.kc-big{font-size:44px;font-weight:800;color:var(--navy);line-height:1}
.kc-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.kc-kpi div{background:var(--sky);border-radius:12px;padding:12px;text-align:center}
.kc-kpi b{display:block;font-size:24px;color:var(--navy)}
.kc-kpi small{font-size:12px;color:var(--mute)}
/* mission */
.kc-hud{position:sticky;top:52px;z-index:20;display:flex;align-items:center;gap:14px;background:#0B2242;color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,30,60,.2)}
.kc-hud .m{flex:1;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.kc-hud .g{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.kc-hud .g i{display:block;height:100%;background:linear-gradient(90deg,#1F6FB2,#7FC4FF);border-radius:6px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.kc-hud .s{font-weight:800;font-size:14px;white-space:nowrap}
.kc-hud.flash{animation:kcFl .8s}
@keyframes kcFl{30%{box-shadow:0 0 0 6px rgba(127,196,255,.45)}}
.kc-stage-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kc-rs{font-size:22px;letter-spacing:2px;margin-right:6px;vertical-align:-3px}
.kc-rs i{font-style:normal;color:#C9D6E3}
.kc-rs i.on{color:#1F6FB2;animation:kcStar .5s both}
.kc-rs i.on:nth-child(2){animation-delay:.15s}.kc-rs i.on:nth-child(3){animation-delay:.3s}
@keyframes kcStar{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.kc-refs{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kc-refs>span{font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#5B6B7C;margin-right:2px}
.kc-refs em{font-style:normal;font-size:12px;border-radius:8px;padding:4px 8px;background:#fff;border:1px solid var(--line)}
.kc-refs em b{font-weight:800;margin-right:3px}
.kc-refs em.s b{color:var(--navy)}.kc-refs em.k b{color:var(--teal)}.kc-refs em.g b{color:var(--violet)}
.kc-shot{border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,40,80,.12);background:#fff}
.kc-shot img{display:block;width:100%}
.kc-vid{background:#0B2242;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(0,30,60,.3)}
.kc-vid .stage{position:relative;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 70% 20%,#14467A,#0B2242 60%)}
.kc-vid .stage img{width:70%;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.kc-vid .vt{color:#fff;text-align:center;font-size:30px;font-weight:800;line-height:1.2;padding:20px;animation:kcIn .8s both}
.kc-vid .vt small{display:block;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#7FC4FF;margin-bottom:10px;font-weight:700}
.kc-vid .vt b{color:#7FC4FF}
.kc-vid .cap{color:#fff;background:rgba(0,0,0,.25);padding:12px 18px;font-size:15px;min-height:48px}
.kc-vid .ctl{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#fff;font-size:13px}
.kc-vid .ctl .kc-btn{background:#fff;color:#0B2242}
.kc-vid .bar{flex:1;height:6px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.kc-vid .bar i{display:block;height:100%;width:0;background:#7FC4FF}
.kz1{animation:kcKb1 6s ease-out both}.kz2{animation:kcKb2 6s ease-out both}.kz3{animation:kcKb1 5s ease-out both}
@keyframes kcKb1{from{transform:scale(1.15) translateY(20px);opacity:0}15%{opacity:1}to{transform:scale(1)}}
@keyframes kcKb2{from{transform:scale(1);opacity:0}15%{opacity:1}to{transform:scale(1.3) translate(-4%,-6%)}}
.kc-vs .row{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.kc-vs .t{height:16px;background:var(--sky);border-radius:8px;overflow:hidden}
.kc-vs .t i{display:block;height:100%;background:var(--navy);border-radius:8px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.kc-chal{display:grid;gap:10px}
.kc-cc{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kc-cc .d{flex:none;width:64px;text-align:center;background:var(--navy);color:#fff;border-radius:12px;padding:6px 0}
.kc-cc .d small{display:block;font-size:11px;font-weight:700;opacity:.8}
.kc-cc .d span{font-size:22px}
/* voice */
.kc-rec{display:flex;align-items:center;gap:14px;margin-top:10px}
.kc-mic{width:64px;height:64px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:26px;cursor:pointer;flex:none;box-shadow:0 6px 16px rgba(0,51,90,.3);transition:transform .2s}
.kc-mic:hover{transform:scale(1.06)}
.kc-rec.on .kc-mic{background:#5B4BC4;animation:kcPulse 1.2s infinite}
@keyframes kcPulse{0%{box-shadow:0 0 0 0 rgba(91,75,196,.5)}70%{box-shadow:0 0 0 18px rgba(91,75,196,0)}100%{box-shadow:0 0 0 0 rgba(91,75,196,0)}}
.kc-rec .w{flex:1}
.kc-rec .st{font-size:13.5px;font-weight:600;color:var(--navy2)}
.kc-rec .wave{display:flex;gap:4px;align-items:center;height:28px;margin-top:4px;opacity:.25}
.kc-rec .wave i{width:5px;height:8px;border-radius:3px;background:var(--violet)}
.kc-rec.on .wave{opacity:1}
.kc-rec.on .wave i{animation:kcWave .9s ease-in-out infinite}
.kc-rec.on .wave i:nth-child(2){animation-delay:.1s}.kc-rec.on .wave i:nth-child(3){animation-delay:.2s}.kc-rec.on .wave i:nth-child(4){animation-delay:.3s}.kc-rec.on .wave i:nth-child(5){animation-delay:.2s}.kc-rec.on .wave i:nth-child(6){animation-delay:.1s}
@keyframes kcWave{50%{height:26px}}
.kc-ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--navy) calc(var(--p)*1%),var(--sky) 0);display:grid;place-items:center;position:relative;flex:none}
.kc-ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#fff}
.kc-ring b,.kc-ring small{position:relative;line-height:1}
.kc-ring b{font-size:28px;color:var(--navy2);margin-top:20px}
.kc-ring small{font-size:11px;color:var(--mute);margin-top:-22px}
.kc-crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.kc-crit .hd{display:flex;justify-content:space-between;font-size:13.5px}
.kc-crit .tr{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:5px 0}
.kc-crit .tr i{display:block;height:100%;background:var(--teal);border-radius:5px}
.kc-crit .tp{font-size:12.5px;color:#33475B}
@media(max-width:560px){.kc-top{padding:8px 12px;gap:10px}.kc-top .t{font-size:13px}.kc-top .t small{display:none}.kc-hud{top:44px}.kc-hud .m span{display:none}.kc-wrap{padding:16px 12px 100px}.kc-hero{padding:24px 18px}.kc-hero h1{font-size:28px}.kc-nav{padding:10px 12px}.kc-btn{padding:11px 16px}}
.kc-x{background:rgba(255,255,255,.14);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
.kc-x:hover{background:rgba(255,255,255,.28)}
/* mic guide */
.kc-mg{position:fixed;inset:0;z-index:80;background:rgba(8,25,45,.55);display:grid;place-items:center;padding:16px;backdrop-filter:blur(3px)}
.kc-mgb{background:#fff;border-radius:20px;padding:22px;max-width:640px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.kc-mgg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:560px){.kc-mgg{grid-template-columns:1fr}}
.kc-mgc{border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13.5px}
.kc-mgc p{margin:4px 0 0;color:#33475B}
.kc-kb{background:#E9EDF2;border-radius:12px;padding:10px;margin-bottom:10px}
.kc-kb .tx{background:#fff;border-radius:8px;padding:7px 9px;font-size:12.5px;color:#14263A;margin-bottom:8px;white-space:nowrap;overflow:hidden;width:0;animation:kcTy 4s steps(32) infinite}
.kc-kb .tx i{display:inline-block;width:1px;height:12px;background:#14263A;vertical-align:-2px;animation:kcBl .8s infinite}
@keyframes kcTy{0%,25%{width:20%}75%,100%{width:100%}}
@keyframes kcBl{50%{opacity:0}}
.kc-kb .keys{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.kc-kb .keys span{height:24px;border-radius:5px;background:#fff;box-shadow:0 1px 0 #B9C3CE}
.kc-kb .keys .mic{display:grid;place-items:center;font-size:13px;background:#5B4BC4;animation:kcPulse 1.4s infinite}
.kc-pc{display:flex;align-items:center;justify-content:center;gap:10px;height:96px;background:#E9EDF2;border-radius:12px;margin-bottom:10px;font-size:18px}
.kc-pc .k{background:#fff;border-radius:8px;padding:10px 14px;font-weight:800;color:var(--navy);box-shadow:0 3px 0 #B9C3CE;animation:kcKey 2s infinite}
.kc-pc .k.h{animation-delay:.25s}
@keyframes kcKey{0%,60%,100%{transform:none;box-shadow:0 3px 0 #B9C3CE}30%{transform:translateY(3px);box-shadow:0 0 0 #B9C3CE}}
.kc-logo{display:inline-flex;align-items:center;justify-content:center;background:#1C345A;border-radius:14px;padding:8px 14px;margin-bottom:14px;box-shadow:0 6px 16px rgba(0,40,80,.18)}
.kc-logo img{height:58px;width:auto;display:block}

/* owner, 25 Nov 2026: pulsing mic when it is the staff member's turn */
.kc-mic.call{animation:kcMicCall 1.3s ease-in-out infinite}
@keyframes kcMicCall{0%{box-shadow:0 0 0 0 rgba(91,75,196,.55);transform:scale(1)}50%{transform:scale(1.08)}70%{box-shadow:0 0 0 18px rgba(91,75,196,0)}100%{box-shadow:0 0 0 0 rgba(91,75,196,0);transform:scale(1)}}
/* owner, 25 Nov 2026: 5-reply call */
.kc-tdots{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#00335A;margin-bottom:10px}
.kc-tdots span{display:flex;gap:6px}.kc-tdots i{width:12px;height:12px;border-radius:50%;background:#DCE5EE}.kc-tdots i.now{background:#5B4BC4;box-shadow:0 0 0 3px rgba(91,75,196,.25)}.kc-tdots i.ok{background:#1E8E5A}.kc-tdots i.mid{background:#6B7A8A}
.kc-fbp{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;border:2px solid #DCE5EE;background:#F6F9FC}
.kc-fbp.goal{border-color:#9DBEDD;background:#EEF4FA}
.kc-fbp.show{border-color:#5B4BC4;background:#F3F1FF;animation:kcFbIn .6s ease both}
@keyframes kcFbIn{0%{transform:scale(.97);box-shadow:0 0 0 0 rgba(91,75,196,.5)}60%{box-shadow:0 0 0 12px rgba(91,75,196,0)}100%{transform:none}}
.kc-fbp .h{font-weight:800;color:#0B2242;margin-bottom:2px}.kc-fbp .top{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.kc-fbp .g{color:#1E6B45;margin:4px 0}.kc-fbp .t{color:#33475B;margin:4px 0}
.kc-fbp details{margin-top:8px}.kc-fbp summary{cursor:pointer;font-weight:700;color:#00335A}
.kc-ring.sm{width:58px;height:58px;flex:none}.kc-ring.sm::before{inset:6px}.kc-ring.sm b{font-size:16px;margin-top:0}
.kc-msc{font-size:11px;font-weight:800;margin-top:4px;text-align:right}.kc-msc.ok{color:#1E8E5A}.kc-msc.mid{color:#6B7A8A}
.kc-f textarea[disabled]{background:#F3F5F8}

/* owner, 25 Nov 2026: screens fit without scrolling */
.kc-shot img{max-height:calc(100vh - 300px);width:auto;max-width:100%;display:block;margin:0 auto}
@media(max-height:760px){.kc-wrap{padding-top:12px}.kc h2{margin-bottom:6px}.kc .lead{font-size:15.5px;margin-bottom:8px}}
.kc-spotnav{margin:0 0 8px}.kc-say{margin:0 0 10px}

function kcRubric(text, V) {
  var t = ' ' + text.toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ') + ' ', words = text.trim().split(/\s+/).filter(Boolean).length;

    var s = c.not ? (bad.length ? Math.max(0, 20 - bad.length * 10) : 20) : Math.min(20, Math.round(hit.length / (c.need || 2) * 20));
    return { k: c.k, s: s, tip: (c.not ? !bad.length : s >= 14) ? c.ok : (c.not && bad.length ? c.no.replace('{w}', bad[0].trim()) : c.no) };
  });
  var score = C.reduce(function (a, c) { return a + c.s; }, 0), extra = [];
  if (words < (V.minW || 15)) { score = Math.max(0, score - 10); extra.push('A bit short. Aim for ' + (V.lenHint || '3–5 sentences') + '.'); }
  if (words > (V.maxW || 120)) { score = Math.max(0, score - 10); extra.push('Quite long. Keep it focused, about ' + (V.maxW || 120) + ' words at most.'); }
  return { score: score, criteria: C, extra: extra, words: words, source: 'rubric' };
}

  post({op:'kc',fn:'load',t:t}).then(function(r){
    if(!r||r.error){ msg(r&&r.error==='expired'?'Your session has ended. Please open the course again from the <b>Training</b> page on the WSE Staff Portal.':'Sorry, the course could not load. Please try again from the Staff Portal.'); return; }
    root.innerHTML='';
    window.kcStart(root,{me:r.me,state:r.state,save:function(k,d){ post({op:'kc',fn:'save',t:t,kind:k,data:d}).catch(function(){}); },onClose:done});
  }).catch(function(){ msg('Sorry, the course could not load. Please check your connection and try again.'); });
})();
</script></body></html>
